<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillWise — Sign In</title>
    <meta name="description" content="Sign in to BillWise — the premium billing and subscription management platform for modern businesses.">

    <!-- Google Identity Services (Untouched logic) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Link to the external JavaScript file (Untouched logic) -->
    <script src="script.js" defer></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            color: #29232d;
            background: #f6f0e7;
        }

        /* =========================================================
           MAIN SCENE
        ========================================================= */

        .scene {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: visible;
            background:
                radial-gradient(ellipse at 7% 8%, rgba(125, 67, 155, 0.15), transparent 30%),
                radial-gradient(ellipse at 96% 10%, rgba(112, 72, 157, 0.12), transparent 28%),
                radial-gradient(ellipse at 84% 91%, rgba(117, 69, 151, 0.10), transparent 32%),
                linear-gradient(135deg, #fbf7ef 0%, #f7f0e6 52%, #f1e8dc 100%);
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: visible;
            border-radius: 0 34px 34px 0;
        }

        .container::before {
            content: "";
            position: absolute;
            left: 6.8%;
            right: 5.0%;
            top: 12.5%;
            bottom: 3.0%;
            min-height: 650px;
            z-index: 1;
            border-radius: 10px 10px 62px 62px;
            background: linear-gradient(145deg, #fffdf8 0%, #faf5ec 48%, #f4ecdf 100%);
            border: 1px solid rgba(113, 76, 137, 0.10);
            box-shadow:
                0 32px 72px rgba(73, 52, 61, 0.13),
                0 13px 32px rgba(73, 52, 61, 0.08),
                inset 0 2px 2px rgba(255,255,255,0.90),
                inset 0 -38px 58px rgba(115, 76, 130, 0.035),
                inset 0 0 95px rgba(118, 66, 145, 0.035);
        }

        .container::after {
            content: "";
            position: absolute;
            left: 7.05%;
            right: 5.25%;
            top: 12.8%;
            bottom: 3.3%;
            min-height: 644px;
            z-index: 2;
            border-radius: 9px 9px 59px 59px;
            border: 1px solid rgba(111, 72, 137, 0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
            pointer-events: none;
        }

        .shape {
            position: absolute;
            z-index: 3;
            pointer-events: none;
        }

        .shape.one {
            width: 430px;
            height: 105px;
            right: -58px;
            top: 8px;
            border-radius: 75px;
            transform: rotate(-47deg);
            background: linear-gradient(100deg, rgba(112, 70, 145, 0.04), rgba(128, 78, 163, 0.34), rgba(101, 55, 132, 0.07));
            border: 1px solid rgba(103, 62, 132, 0.12);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.45), 0 20px 42px rgba(91, 54, 115, 0.10);
            backdrop-filter: blur(5px);
        }

        .shape.two {
            width: 470px;
            height: 78px;
            left: -125px;
            bottom: 65px;
            transform: rotate(-47deg);
            background: linear-gradient(90deg, rgba(100, 54, 127, 0.03), rgba(120, 65, 148, 0.25), rgba(91, 46, 116, 0.03));
        }

        .shape.three {
            width: 88px;
            height: 370px;
            right: -5px;
            bottom: -130px;
            border-radius: 70px;
            transform: rotate(24deg);
            background: linear-gradient(180deg, rgba(103, 62, 139, 0.04), rgba(122, 77, 158, 0.30), rgba(84, 44, 111, 0.04));
            border: 1px solid rgba(102, 62, 133, 0.10);
            backdrop-filter: blur(5px);
        }

        .shape.four {
            width: 250px;
            height: 250px;
            left: -118px;
            top: 315px;
            border: 7px solid rgba(115, 63, 142, 0.18);
            border-radius: 50%;
        }

        .shape.five {
            width: 5px;
            height: 190px;
            left: 30.8%;
            top: -12px;
            background: rgba(119, 73, 146, 0.20);
            box-shadow: 20px 0 0 rgba(91, 51, 119, 0.13);
        }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
        }

        .welcome {
            position: absolute;
            left: 14.5%;
            top: 20%;
            width: 39%;
            z-index: 10;
        }

        .brand {
            font-size: 32px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1.2px;
            margin-bottom: 96px;
            color: #34243d;
            text-shadow: 0 2px 8px rgba(75, 52, 81, 0.10);
        }

        .welcome h1 {
            font-size: 68px;
            line-height: 1;
            font-weight: 750;
            letter-spacing: -3px;
            margin-bottom: 47px;
            color: #29222c;
            text-shadow: 0 3px 12px rgba(80, 60, 75, 0.10);
        }

        .small-line {
            width: 48px;
            height: 3px;
            margin-bottom: 38px;
            background: #76508d;
            border-radius: 4px;
        }

        .welcome p {
            width: 390px;
            font-size: 13px;
            line-height: 1.75;
            color: #756b72;
            margin-bottom: 36px;
        }

        .learn-btn {
            height: 41px;
            padding: 0 22px;
            border: none;
            outline: none;
            border-radius: 9px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #76509a, #5f397f);
            box-shadow: 0 8px 19px rgba(103, 66, 128, 0.22), inset 0 1px 1px rgba(255,255,255,0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .learn-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(103, 66, 128, 0.28);
        }

        .auth-area {
            position: absolute;
            left: 56.8%;
            top: 23.8%;
            width: 32.0%;
            z-index: 12;
            padding-bottom: 40px;
        }

        .auth-card {
            width: 100%;
            position: relative;
            padding: 38px 50px 28px;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(249,243,234,0.94));
            border: 1px solid rgba(111, 75, 132, 0.13);
            box-shadow:
                0 30px 60px rgba(67, 49, 58, 0.13),
                0 10px 25px rgba(67, 49, 58, 0.07),
                inset 0 1px 0 rgba(255,255,255,0.95),
                inset 0 -22px 42px rgba(113, 72, 134, 0.025);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 2px;
            border-radius: 10px;
            background: linear-gradient(90deg, transparent, rgba(118, 75, 148, 0.65), transparent);
        }

        .form {
            display: none;
        }

        .form.active,
        #signin-form:not(.hidden),
        #signup-form:not(.hidden) {
            display: block;
        }

        .auth-card h2,
        #form-title {
            text-align: center;
            font-size: 37px;
            line-height: 1;
            font-weight: 750;
            letter-spacing: -1px;
            margin-bottom: 22px;
            color: #32283a;
            text-shadow: 0 2px 8px rgba(77, 57, 82, 0.08);
        }

        .credentials-title,
        #form-subtitle {
            text-align: center;
            font-size: 11px;
            color: #887c85;
            margin-bottom: 21px;
        }

        .field,
        .input-group {
            margin-bottom: 17px;
        }

        .field label,
        .input-group label {
            display: block;
            font-size: 12px;
            line-height: 1;
            font-weight: 700;
            margin-bottom: 9px;
            color: #403641;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field input,
        .input-group input {
            display: block;
            width: 100%;
            height: 39px;
            padding: 0 17px;
            border: 1px solid rgba(105, 75, 116, 0.13);
            outline: none;
            border-radius: 22px;
            color: #352c38;
            font-size: 12px;
            background: linear-gradient(180deg, #f8f3eb, #f3ece2);
            box-shadow: inset 0 2px 7px rgba(77, 58, 70, 0.035);
            transition: 0.2s ease;
        }

        .field input::placeholder,
        .input-group input::placeholder {
            color: #a49aa1;
        }

        .field input:focus,
        .input-group input:focus {
            background: #fffdf9;
            border-color: rgba(113, 70, 143, 0.40);
            box-shadow: 0 0 0 3px rgba(118, 76, 147, 0.08), inset 0 2px 7px rgba(77, 58, 70, 0.035);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -2px;
            margin-bottom: 17px;
            font-size: 10px;
            color: #76508d;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot:hover {
            color: #4f3168;
        }

        .submit-btn,
        .btn,
        .btn-primary {
            width: 100%;
            height: 40px;
            margin-top: 5px;
            border: none;
            outline: none;
            border-radius: 22px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(100deg, #8055a1 0%, #623b82 100%);
            box-shadow: 0 8px 18px rgba(99, 60, 128, 0.24), inset 0 1px 1px rgba(255,255,255,0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .submit-btn:hover,
        .btn:hover,
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(99, 60, 128, 0.31);
        }

        .google-btn-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .google-btn {
            width: 100%;
            height: 40px;
            margin-top: 12px;
            border: 1px solid rgba(91, 66, 102, 0.13);
            outline: none;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #4c424d;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.70);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.85);
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        .google-btn:hover {
            background: #ffffff;
            border-color: rgba(103, 65, 128, 0.25);
            transform: translateY(-1px);
        }

        .google-icon {
            width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ffffff;
            color: #4285f4;
            font-size: 12px;
            font-weight: 800;
            font-family: Arial, sans-serif;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .social {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 19px;
        }

        .social span {
            font-size: 20px;
            line-height: 1;
            color: #76508d;
            opacity: 0.92;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .social span:hover {
            transform: translateY(-2px);
            color: #4f3168;
        }

        .switch-text {
            text-align: center;
            margin-top: 14px;
            font-size: 10px;
            color: #887c85;
        }

        .switch-btn {
            border: none;
            background: none;
            padding: 0;
            color: #684583;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        .switch-btn:hover {
            color: #43295a;
        }

        .message {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 10px;
            color: #76508d;
        }

        #signup-form h2 {
            font-size: 35px;
            margin-bottom: 18px;
        }

        #signup-form .credentials-title {
            margin-bottom: 20px;
        }

        #signup-form .field {
            margin-bottom: 14px;
        }

        #signup-form .field label {
            margin-bottom: 8px;
        }

        #signup-form .field input {
            height: 38px;
        }

        #signup-form .submit-btn {
            margin-top: 6px;
        }

        #signup-form .social {
            margin-top: 16px;
        }

        #signup-form .switch-text {
            margin-top: 11px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            color: #9e96a0;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(111, 75, 132, 0.15);
        }

        .hidden {
            display: none !important;
        }

        @media (max-height: 800px) and (min-width: 851px) {
            .scene { min-height: 900px; }
            .container { min-height: 900px; }
            .content { min-height: 900px; }
            .container::before { min-height: 790px; bottom: 30px; }
            .container::after { min-height: 784px; bottom: 33px; }
            .welcome { top: 18%; }
            .auth-area { top: 19%; padding-bottom: 70px; }
        }

        @media (max-width: 850px) {
            body { overflow-x: hidden; overflow-y: auto; }
            .scene { min-height: 100vh; height: auto; }
            .container { min-height: 100vh; height: auto; }
            .container::before {
                position: absolute;
                left: 5%;
                right: 5%;
                top: 35px;
                bottom: 35px;
                min-height: 1100px;
                border-radius: 18px 18px 50px 50px;
            }
            .container::after {
                left: 5.3%;
                right: 5.3%;
                top: 38px;
                bottom: 38px;
                min-height: 1094px;
            }
            .content { min-height: 1200px; }
            .welcome {
                position: relative;
                left: auto;
                top: auto;
                width: 100%;
                padding: 80px 9% 30px;
            }
            .brand { margin-bottom: 60px; }
            .welcome h1 { font-size: 60px; }
            .auth-area {
                position: relative;
                left: auto;
                top: auto;
                width: 100%;
                padding: 25px 8% 100px;
            }
            .auth-card {
                width: min(100%, 450px);
                margin: 0 auto;
            }
        }

        @media (max-width: 480px) {
            .container::before { min-height: 1130px; left: 4%; right: 4%; }
            .container::after { min-height: 1124px; left: 4.3%; right: 4.3%; }
            .content { min-height: 1230px; }
            .welcome { padding: 55px 30px 20px; }
            .brand { font-size: 28px; margin-bottom: 50px; }
            .welcome h1 { font-size: 48px; letter-spacing: -2px; margin-bottom: 35px; }
            .welcome p { width: 100%; font-size: 12px; }
            .auth-area { padding: 20px 20px 80px; }
            .auth-card { width: 100%; padding: 32px 25px 27px; }
            .auth-card h2, #form-title { font-size: 32px; }
        }
    </style>

    <link rel="stylesheet" href="ui-redesign.css">
</head>
<body>

    <div class="auth-layout">

        <div class="scene">
            <div class="container">
                <div class="shape one"></div>
                <div class="shape two"></div>
                <div class="shape three"></div>
                <div class="shape four"></div>
                <div class="shape five"></div>

                <div class="content">
                    <section class="welcome">
                        <div class="brand">BillWise</div>
                        <h1>Welcome!</h1>
                        <div class="small-line"></div>
                        <p>
                            Manage your bills smarter with BillWise.
                            Keep track of payments, organize expenses,
                            and stay financially informed — all in one place.
                        </p>
                        <button type="button" class="learn-btn" onclick="alert('BillWise helps you manage bills, payments and expenses in one place.')">
                            Learn More
                        </button>
                    </section>

                    <section class="auth-area">
                        <div class="auth-card">
                            <div class="auth-card-header">
                                <h2 id="form-title">Sign In</h2>
                                <p id="form-subtitle">Welcome back to the Billing Platform</p>
                            </div>

                            <div id="g_id_onload"
                                 data-client_id="947976051057-ncvdo5vr5ov3uqm49vvbg3kk9oq16t4v.apps.googleusercontent.com"
                                 data-context="signin"
                                 data-ux_mode="popup"
                                 data-callback="handleGoogleLogin"
                                 data-auto_prompt="false">
                            </div>

                            <div class="google-btn-wrapper">
                                <div class="g_id_signin"
                                     data-type="standard"
                                     data-shape="rectangular"
                                     data-theme="outline"
                                     data-text="continue_with"
                                     data-size="large"
                                     data-logo_alignment="left">
                                </div>
                            </div>

                            <div class="auth-divider">or</div>

                            <form id="signin-form" class="form active">
                                <div class="input-group">
                                    <label for="signin-email">Email Address</label>
                                    <input type="email" id="signin-email" required placeholder="you@company.com">
                                </div>
                                <div class="input-group">
                                    <label for="signin-password">Password</label>
                                    <input type="password" id="signin-password" required placeholder="••••••••">
                                </div>
                                <button type="submit" class="btn btn-primary">Sign In</button>
                            </form>

                            <form id="signup-form" class="form hidden">
                                <div class="input-group">
                                    <label for="signup-email">Email Address</label>
                                    <input type="email" id="signup-email" required placeholder="you@company.com">
                                </div>
                                <div class="input-group">
                                    <label for="signup-password">Password</label>
                                    <input type="password" id="signup-password" required placeholder="Create a strong password">
                                </div>
                                <button type="submit" class="btn btn-primary">Create Account</button>
                            </form>

                            <div class="switch-text" id="toggle-container">
                                Don't have an account? <a href="#" onclick="toggleForms(); return false;">Sign up</a>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>

</body>
</html>
